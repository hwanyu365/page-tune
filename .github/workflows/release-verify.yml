name: Release verify

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: |
          ./gradlew -p buildSrc test && ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      # 에뮬레이터 하드웨어 가속은 러너 사용자에게 /dev/kvm 권한이 있어야 켜진다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # 태그 없는 빌드는 versionCode 1 이라 새 소식 경로를 판정할 수 없다 → 태그 실행에서는 그 태그로 빌드한다.
        env:
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # 러너의 avdmanager 에 최신 기기 정의가 없다 → 로컬 AVD(Pixel 8 Pro)와 같은 화면 값을 직접 넣는다.
          pre-emulator-launch-script: |
            sed -i '/^hw\.lcd\./d' ~/.android/avd/test.avd/config.ini
            echo 'hw.lcd.width=1344' >> ~/.android/avd/test.avd/config.ini
            echo 'hw.lcd.height=2992' >> ~/.android/avd/test.avd/config.ini
            echo 'hw.lcd.density=480' >> ~/.android/avd/test.avd/config.ini
            grep '^hw\.lcd\.' ~/.android/avd/test.avd/config.ini
          disable-animations: true
          # config.ini 값이 화면에 반영되지 않으면 다른 화면에서 판정하게 된다 → 테스트 전에 확인한다.
          script: |
            adb shell wm size | grep -q 'Physical size: 1344x2992' && adb shell wm density | grep -q 'Physical density: 480' && ./gradlew connectedDebugAndroidTest
      - name: TC#506 서명 정보 없는 release 빌드는 빠진 키 이름과 함께 실패한다
        run: |
          if ./gradlew bundleRelease assembleRelease --continue > "$RUNNER_TEMP/unsigned.log" 2>&1; then echo "::error::서명 정보 없이 release 빌드가 성공함"; exit 1; fi
          for task in signReleaseBundle packageRelease; do
            grep -A1 "Execution failed for task ':app:$task'" "$RUNNER_TEMP/unsigned.log" | grep -q 'Release signing is not configured: RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD' || { echo "::error::$task 가 빠진 키 이름으로 실패하지 않음"; cat "$RUNNER_TEMP/unsigned.log"; exit 1; }
          done
      # jarsigner -verify 는 서명 없는 파일에도 0 을 반환한다 → 출력으로 판정한다.
      - name: TC#505 일회용 키로 서명한 release 번들은 그 키의 서명으로 검증된다
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/throwaway.jks
          RELEASE_STORE_PASSWORD: throwaway
          RELEASE_KEY_ALIAS: throwaway
          RELEASE_KEY_PASSWORD: throwaway
        run: |
          keytool -genkeypair -keystore "$RELEASE_STORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname CN=release-verify
          ./gradlew bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/verify.log"
          grep -qx 'jar verified.' "$RUNNER_TEMP/verify.log" && grep -q 'Signed by "CN=release-verify"' "$RUNNER_TEMP/verify.log" || { cat "$RUNNER_TEMP/verify.log"; exit 1; }
      - name: TC#408 배포 태스크는 listing 을 게시하지 않는다
        run: |
          ./gradlew publishReleaseBundle --dry-run > "$RUNNER_TEMP/publish.log"
          grep -q '^:app:publishReleaseBundle ' "$RUNNER_TEMP/publish.log" && ! grep -E '^:app:publish[A-Za-z]*Listing ' "$RUNNER_TEMP/publish.log" || { cat "$RUNNER_TEMP/publish.log"; exit 1; }
      - name: TC#24 release 번들에 테스트 전용 라이브러리 클래스가 없다
        run: |
          unzip -o -q app/build/outputs/bundle/release/app-release.aab 'base/dex/*' -d "$RUNNER_TEMP/aab"
          dexdump="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)dexdump"
          for dex in "$RUNNER_TEMP"/aab/base/dex/*.dex; do "$dexdump" "$dex" | grep 'Class descriptor'; done > "$RUNNER_TEMP/classes.txt"
          grep -q 'Lcom/hwanyu365/pagetune/MainActivity;' "$RUNNER_TEMP/classes.txt" || { echo "::error::번들 클래스 목록을 읽지 못함"; exit 1; }
          if grep -E "'Lorg/(htmlunit|json)/" "$RUNNER_TEMP/classes.txt"; then echo "::error::테스트 전용 라이브러리 클래스가 번들에 있음"; exit 1; fi
      # 검사가 실제로 막는지 보려고 위반을 하나씩 넣는다 → 작업 트리를 바꾸므로 마지막에 두고 되돌린다.
      - name: TC#20 lint 는 하드코딩 문자열과 번역 누락을 오류로 막는다
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<TextView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Probe" />' > app/src/main/res/layout/tc20_probe.xml
          sed -i 's#^</resources>#    <string name="tc20_probe">Probe</string>\n</resources>#' app/src/main/res/values/strings.xml
          if ./gradlew lintDebug > "$RUNNER_TEMP/lint.log" 2>&1; then echo "::error::위반을 넣었는데 lint 가 통과함"; exit 1; fi
          tr '\n' ' ' < app/build/reports/lint-results-debug.xml | grep -o '<issue [^>]*>' > "$RUNNER_TEMP/issues.txt"
          for id in HardcodedText MissingTranslation; do
            grep "id=\"$id\"" "$RUNNER_TEMP/issues.txt" | grep -q 'severity="Error"' || { echo "::error::lint 가 $id 를 오류로 내지 않음"; cat "$RUNNER_TEMP/lint.log"; exit 1; }
          done
          git checkout -- app/src/main/res/values/strings.xml && rm app/src/main/res/layout/tc20_probe.xml
