name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # .gitignore 가 놓친 비밀 파일이 추적되면 merge 전에 막는다. 값 없는 예시 파일(*.example)은 허용한다.
      - name: Guard secrets
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(jks|keystore|pem)$|(^|/)service-account.*\.json$' | grep -vE '\.example$' || true)
          if [ -n "$leaked" ]; then echo "::error::committed secret files: $leaked"; exit 1; fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # 비밀값 없이 실행한다 → fork PR 에서도 같은 결과여야 한다.
      - run: |
          ./gradlew -p buildSrc test && ./gradlew lintDebug testDebugUnitTest assembleDebug
