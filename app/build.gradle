apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.github.triplet.play'

// 마이그레이션 SQL 이 엔티티와 어긋나면 Room 이 런타임에 터진다. 스키마 스냅샷을 남겨 커밋 시점에 대조할 수 있게 한다.
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

def env = { String key -> findProperty(key) ?: System.getenv(key) }
def releaseVersion = ReleaseVersion.Companion.fromTag(env('VERSION_TAG'))

android {
    namespace 'com.hwanyu365.pagetune'
    compileSdk 36

    defaultConfig {
        applicationId "com.hwanyu365.pagetune"
        minSdk 24
        targetSdk 36
        versionCode releaseVersion.code
        versionName releaseVersion.name
    }

    signingConfigs {
        release {
            def storeFilePath = env('RELEASE_STORE_FILE')
            storeFile storeFilePath ? file(storeFilePath) : null
            storePassword env('RELEASE_STORE_PASSWORD')
            keyAlias env('RELEASE_KEY_ALIAS')
            keyPassword env('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

// 서명 값이 비면 AGP 는 패키징 단계에서 원인 없는 NPE 로 실패한다. 서명이 필요한 태스크에서만 빠진 키 이름을 알려준다.
tasks.matching { it.name in ['signReleaseBundle', 'packageRelease'] }.configureEach {
    doFirst {
        def missing = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD'].findAll { !env(it) }
        if (missing) {
            throw new GradleException("Release signing is not configured: ${missing.join(', ')}")
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// 인증 정보는 ANDROID_PUBLISHER_CREDENTIALS 환경변수로만 받는다. 키 파일을 디스크에 두지 않기 위해서다.
play {
    track = 'internal'
    defaultToAppBundles = true
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room components
    def room_version = "2.8.5"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    testImplementation 'junit:junit:4.13.2'
}
