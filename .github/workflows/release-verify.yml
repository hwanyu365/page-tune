name: Release verify

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: |
          ./gradlew -p buildSrc test && ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      # 에뮬레이터 하드웨어 가속은 러너 사용자에게 /dev/kvm 권한이 있어야 켜진다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # 러너의 avdmanager 에 최신 기기 정의가 없다 → 로컬 AVD(Pixel 8 Pro)와 같은 화면 값을 직접 넣는다.
          pre-emulator-launch-script: |
            sed -i '/^hw\.lcd\./d' ~/.android/avd/test.avd/config.ini
            echo 'hw.lcd.width=1344' >> ~/.android/avd/test.avd/config.ini
            echo 'hw.lcd.height=2992' >> ~/.android/avd/test.avd/config.ini
            echo 'hw.lcd.density=480' >> ~/.android/avd/test.avd/config.ini
            grep '^hw\.lcd\.' ~/.android/avd/test.avd/config.ini
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
